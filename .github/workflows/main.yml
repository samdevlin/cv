on:
  release:
    types: [published]

name: CreatePDFs

jobs:
  makepdfs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: mkrakowitzer/actions-makepdfs@master
      if: github.ref == 'refs/heads/master'
      with:
        markdown_dir: .
        output_dir: pdfs
    - uses: actions/upload-artifact@v4
      with:
        name: platform-architecture-docs
        path: tmp
